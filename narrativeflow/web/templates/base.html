<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}NarrativeFlow{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <nav>
    <a href="/" class="brand">NarrativeFlow</a>
    <form action="/search" method="get" class="search-form">
      <input type="search" name="q" placeholder="Search a narrative — e.g. AI infra, 核电, GLP-1" value="{{ q if q is defined else '' }}">
      <button type="submit">Search</button>
    </form>
    <span class="ai-pill {{ 'on' if ai_enabled else 'off' }}">
      🤖 AI {{ 'enabled' if ai_enabled else 'disabled (heuristic mode)' }}
    </span>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  <span>NarrativeFlow v{{ version }}</span>
  <span>Public-source synthesis · not investment advice</span>
</footer>
</body>
</html>
