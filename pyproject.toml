[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-alpha"
version = "0.1.0"
description = "Narrative Alpha — a narrative lifecycle tracker for alpha discovery"
requires-python = ">=3.10"
authors = [{ name = "Aaron Cai" }]
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0.10",
    "jinja2>=3.1.2",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4"]

[project.scripts]
narrative-alpha = "narrative_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["narrative_alpha*"]

[tool.setuptools.package-data]
narrative_alpha = ["templates/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
